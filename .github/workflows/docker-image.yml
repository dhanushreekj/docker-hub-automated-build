name: Docker Hub Automated Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Validate Docker Hub credentials
      - name: Validate credentials
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "Docker Hub username is missing"
            exit 1
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "Docker Hub token is missing"
            exit 1
          fi

          if [[ "$DOCKER_USER" =~ [[:space:]] ]] || [[ "$DOCKER_TOKEN" =~ [[:space:]] ]]; then
            echo "Credentials contain unwanted whitespace"
            exit 1
          fi

          echo "Docker Hub credentials are present."

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: dhanushreekj/docker-hub-automated-build:latest
